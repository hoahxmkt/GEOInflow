name: Build GEOInflow image (GHCR)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.liekan'
      - '.github/workflows/ghcr-liekan.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.liekan
          platforms: linux/amd64
          push: true
          build-args: |
            LIEKAN_REVISION=${{ github.sha }}
          tags: |
            ghcr.io/hoahxmkt/geoinflow:1.2.0
            ghcr.io/hoahxmkt/geoinflow:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
